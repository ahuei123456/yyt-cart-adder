name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # dist/ is committed so Tampermonkey can install and auto-update from
      # it; fail when it was not rebuilt after a source change.
      - name: Check the committed build is up to date
        run: git diff --exit-code -- dist/
