name: Site check

# Catch changes to YYT's pages before they break a real order.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/site-check.mjs
